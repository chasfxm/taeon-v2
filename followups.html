<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    태온 V2 일정·후속조치
</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        #f4f6f8;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    color:
        #172033;
}


.wrap {

    max-width:
        1250px;

    margin:
        0 auto;

    padding:
        24px;
}


.top {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        18px;
}


h1 {

    margin:
        0;

    font-size:
        24px;
}


.panel {

    background:
        white;

    border:
        1px solid #dde3ea;

    border-radius:
        8px;

    padding:
        18px;

    margin-bottom:
        16px;
}


.controls {

    display:
        flex;

    gap:
        8px;

    align-items:
        center;
}


input,
button {

    height:
        38px;

    border-radius:
        6px;

    border:
        1px solid #ccd3dc;

    padding:
        0 12px;
}


button {

    cursor:
        pointer;

    background:
        #111827;

    color:
        white;
}


.summary {

    display:
        grid;

    grid-template-columns:
        repeat(
            5,
            1fr
        );

    gap:
        10px;
}


.card {

    border:
        1px solid #e0e5eb;

    border-radius:
        7px;

    padding:
        14px;

    background:
        #fafbfc;
}


.label {

    font-size:
        12px;

    color:
        #697386;
}


.value {

    font-size:
        24px;

    font-weight:
        700;

    margin-top:
        5px;
}


.group {

    margin-bottom:
        20px;
}


.group h2 {

    font-size:
        17px;

    margin:
        0 0 10px 0;
}


.item {

    border:
        1px solid #e2e7ed;

    border-radius:
        6px;

    padding:
        12px;

    margin-bottom:
        8px;
}


.item-title {

    font-weight:
        700;

    margin-bottom:
        5px;
}


.meta {

    font-size:
        13px;

    color:
        #667085;

    margin-top:
        4px;
}


.empty {

    color:
        #8892a0;

    padding:
        8px;
}


.back {

    text-decoration:
        none;

    color:
        #172033;

    background:
        white;

    border:
        1px solid #ccd3dc;

    padding:
        9px 14px;

    border-radius:
        6px;
}


@media (
    max-width:
        850px
) {

    .summary {

        grid-template-columns:
            repeat(
                2,
                1fr
            );
    }
}

</style>

</head>


<body>

<div class="wrap">

    <div class="top">

        <h1>
            일정·후속조치
        </h1>

        <a
            class="back"
            href="/"
        >
            통합 대시보드
        </a>

    </div>


    <div class="panel">

        <div class="controls">

            <input
                id="targetDate"
                type="date"
            >

            <button
                id="todayBtn"
                type="button"
            >
                오늘
            </button>

            <button
                id="loadBtn"
                type="button"
            >
                조회
            </button>

        </div>

    </div>


    <div class="panel">

        <div class="summary">

            <div class="card">

                <div class="label">
                    지연
                </div>

                <div
                    id="overdueCount"
                    class="value"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="label">
                    오늘
                </div>

                <div
                    id="todayCount"
                    class="value"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="label">
                    예정
                </div>

                <div
                    id="upcomingCount"
                    class="value"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="label">
                    날짜미정
                </div>

                <div
                    id="unscheduledCount"
                    class="value"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="label">
                    완료
                </div>

                <div
                    id="completedCount"
                    class="value"
                >
                    0
                </div>

            </div>

        </div>

    </div>


    <div
        id="content"
        class="panel"
    ></div>

</div>


<script
    src="/js/followups.js"
></script>

</body>

</html>
