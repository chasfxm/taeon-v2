<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        04_입찰 | TAEON V2
    </title>

    <link
        rel="stylesheet"
        href="../css/module.css"
    >

    <link rel="stylesheet" href="../css/intake.css">
    <link rel="stylesheet" href="../css/workspace-builder.css">
</head>

<body>


<div class="layout">


    <aside class="sidebar">

        <div class="brand-title">
            TAEON V2
        </div>

        <div class="brand-sub">
            태온종합건설 통합관리
        </div>


        <a
            class="back-dashboard"
            href="../index.html"
        >
            ← 통합 대시보드
        </a>
        <div class="side-quick-menu">

            <a
                class="side-utility"
                href="../journal.html"
            >
                업무일지
            </a>

            <a
                class="side-utility"
                href="../followups.html"
            >
                일정 · 후속조치
            </a>

        </div>


        <div class="side-title">
            입찰 기능
        </div>


        <div
            id="featureNav"
            class="feature-nav"
        >
        </div>

    </aside>



    <main class="main">


        <header class="topbar">

            <div>

                <h1 id="moduleTitle">
                    04_입찰
                </h1>

                <div
                    id="moduleSubtitle"
                    class="subtitle"
                >
                </div>

            </div>


            <div
                id="apiStatus"
                class="status"
            >
                연결 확인중...
            </div>

        </header>



        <section
            id="featureGrid"
            class="feature-grid"
        >
        </section>



        <section class="panel">

            <strong>
                현재 선택 업무 :
            </strong>

            <span id="selectedFeature">
            </span>

            &nbsp;&nbsp;|&nbsp;&nbsp;

            전체
            <strong id="moduleEventCount">
                0
            </strong>

            건 /

            미완료
            <strong id="moduleOpenCount">
                0
            </strong>

            건 /

            완료
            <strong id="moduleDoneCount">
                0
            </strong>

            건

        </section>



        <section class="intake-panel">

    <div class="intake-head">

        <div class="intake-title">
            자료 입력 · 자동판독
        </div>

        <div class="intake-target">
            파일 / PDF / Excel / TXT / 텍스트 붙여넣기
        </div>

    </div>


    <div class="intake-body">


        <div
            id="intakeDrop"
            class="intake-drop"
        >

            <strong>
                파일을 여기에 끌어다 놓으세요
            </strong>

            <small>
                PDF · Excel · CSV · TXT · JSON 등<br>
                또는 파일 선택 버튼 사용
            </small>


            <div
                id="intakeFileName"
                class="intake-file-name"
            >
                선택된 파일 없음
            </div>


            <input
                id="intakeFile"
                type="file"
                hidden
            >


            <div class="intake-buttons">

                <button
                    id="chooseFileBtn"
                    class="btn"
                    type="button"
                >
                    파일 선택
                </button>

                <button
                    id="previewFileBtn"
                    class="btn primary"
                    type="button"
                >
                    파일 자동판독
                </button>

            </div>

        </div>



        <div class="intake-text">

            <textarea
                id="intakeText"
                placeholder="카톡, 이메일, 메모, 계좌잔액 등 텍스트를 여기에 붙여넣으세요."
            ></textarea>


            <div class="intake-buttons">

                <button
                    id="clipboardBtn"
                    class="btn"
                    type="button"
                >
                    클립보드 가져오기
                </button>

                <button
                    id="previewTextBtn"
                    class="btn primary"
                    type="button"
                >
                    텍스트 자동판독
                </button>

            </div>

        </div>

    </div>


    <div
        id="intakePreview"
        class="intake-preview"
    >

        <div class="intake-preview-grid">

            <div class="intake-preview-label">
                파일
            </div>

            <div id="previewFile">
            </div>


            <div class="intake-preview-label">
                형식
            </div>

            <div id="previewType">
            </div>


            <div class="intake-preview-label">
                추출문자
            </div>

            <div id="previewLength">
            </div>


            <div class="intake-preview-label">
                적용대상
            </div>

            <div id="previewTarget">
            </div>

        </div>


        
<div
    id="intakeStructuredFields"
    class="intake-fields"
>
</div>

<div
            id="previewText"
            class="intake-preview-text"
        >
        </div>


        <div class="intake-buttons">

            <button
                id="applyIntakeBtn"
                class="btn primary"
                type="button"
            >
                현재 업무에 적용
            </button>

<span
    id="intakeStatusBadge"
    class="intake-status-badge waiting"
>
    판독 대기
</span>

<button
    id="newIntakeBtn"
    class="btn intake-new-button"
    type="button"
>
    새 자료 입력
</button>

        </div>

    </div>


    <div
        id="intakeResult"
        class="intake-result"
    >
    </div>

</section>

<section class="two-column">


            <!-- 업무등록 -->

            <div class="panel">

                <h2>
                    업무 등록
                </h2>


                <div class="form-grid">


                    <div class="form-group full">

                        <label>
                            업무 제목
                        </label>

                        <input
                            id="eventTitle"
                            type="text"
                            placeholder="업무 제목 입력"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            회사
                        </label>

                        <input
                            id="eventCompany"
                            type="text"
                            value="주식회사 태온종합건설"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            현장 / 관련장소
                        </label>

                        <input
                            id="eventSite"
                            type="text"
                            placeholder="예: 공릉복지관"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            담당 / 관련자
                        </label>

                        <input
                            id="eventPeople"
                            type="text"
                            placeholder="여러 명이면 쉼표로 구분"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            업무 내용
                        </label>

                        <textarea
                            id="eventContent"
                            placeholder="업무내용, 진행사항, 메모"
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label>
                            후속조치 예정일
                        </label>

                        <input
                            id="followUpDate"
                            type="datetime-local"
                        >

                    </div>

                </div>


                <div class="actions">

                    <button
                        id="createEventBtn"
                        class="btn primary"
                    >
                        업무 등록
                    </button>

                </div>


                <div
                    id="eventMessage"
                    class="message"
                >
                </div>

            </div>



            <!-- 문서등록 -->

            <div class="panel">

                <h2>
                    문서 등록
                </h2>


                <div class="form-grid">


                    <div class="form-group full">

                        <label>
                            파일 전체경로
                        </label>

                        <input
                            id="documentPath"
                            type="text"
                            placeholder="예: D:\자료\계약서.pdf"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            문서 제목
                        </label>

                        <input
                            id="documentTitle"
                            type="text"
                            placeholder="문서 제목"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            메모
                        </label>

                        <textarea
                            id="documentMemo"
                            placeholder="문서 관련 메모"
                        ></textarea>

                    </div>

                </div>


                <div class="actions">

                    <button
                        id="registerDocumentBtn"
                        class="btn primary"
                    >
                        문서 등록
                    </button>

                </div>


                <div
                    id="documentMessage"
                    class="message"
                >
                </div>

            </div>


        </section>



        <!-- 조회 -->

        <section class="panel">

            <h2>
                업무이력 조회
            </h2>


            <div class="search-row">

                <input
                    id="searchKeyword"
                    type="text"
                    placeholder="제목·내용·회사·현장·담당자 검색"
                >


                <select id="searchStatus">

                    <option value="">
                        전체 상태
                    </option>

                    <option value="OPEN">
                        미완료
                    </option>

                    <option value="DONE">
                        완료
                    </option>

                </select>


                <button
                    id="searchBtn"
                    class="btn"
                >
                    검색
                </button>

            </div>


            <div class="actions">

                <button
                    id="reloadBtn"
                    class="btn"
                >
                    새로고침
                </button>

            </div>


            <div
                id="eventList"
                class="event-list"
            >

                <div class="empty">
                    불러오는 중...
                </div>

            </div>

        </section>


    </main>


</div>


<script>

window.TAEON_MODULE = {

    folder:
        "04_입찰",

    code:
        "BID",

    name:
        "입찰",

    features:
        ["입찰공고","투찰","적격심사","조달나라장터","낙찰","계약연결","후속조치"]
};

</script>


<script src="../js/module.js"></script>
<script src="../js/intake.js"></script>


<script src="../js/workspace-builder.js"></script>

</body>

</html>
